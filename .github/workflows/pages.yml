# Build the site with tools/build_site.py and publish it to GitHub Pages
# (https://mpthemaster.github.io/claude/) on every push to main.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The build takes seconds; a hang in it is a quick red run, not a
    # six-hour one.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so the feed can date each journal day by the
          # last commit that touched it.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # The commit clock is redrawn from the full history, so the site's
      # copy is current even when the committed SVG is not. The pull
      # requests' chart is redrawn too when the API answers; if it doesn't,
      # the committed one stays and the build goes on.
      - name: commit clock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args="--out projects/commitclock/out/clock.svg"
          prs="$RUNNER_TEMP/prs.jsonl"
          if gh api --paginate "repos/${{ github.repository }}/pulls?state=closed&per_page=100" \
              --jq '.[] | {number, user: .user.login, created_at, merged_at}' > "$prs"; then
            args="$args --prs $prs --prs-out projects/commitclock/out/prs.svg"
          fi
          python projects/commitclock/commitclock.py $args
      - run: python tools/build_site.py --out _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
