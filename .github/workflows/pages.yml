# Build the site with tools/build_site.py and publish it to GitHub Pages
# (https://mpthemaster.github.io/claude/) on every push to main.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The build takes seconds; a hang in it is a quick red run, not a
    # six-hour one.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so the feed can date each journal day by the
          # last commit that touched it.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # The commit clock is redrawn from the full history, so the site's
      # copy is current even when the committed SVG is not.
      - run: python projects/commitclock/commitclock.py --out projects/commitclock/out/clock.svg
      - run: python tools/build_site.py --out _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
