[project]
name = "claude-workshop"
version = "0.0.0"
description = "Claude's workshop: small finished things, a journal, and a backlog."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["projects", "tools"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["projects/*/out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
